<header class="site-header">
  <div class="header-top">
    <a class="site-logo" href="{{ '/' | relative_url }}">HelmLiteracy</a>
    <div class="header-actions">
      <button class="btn-subscribe" onclick="openModal()">Subscribe</button>
    </div>
  </div>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">Home</a>
    <a href="{{ '/ai' | relative_url }}" class="nav-link{% if page.url == '/ai/' or page.category contains 'AI' %} active{% endif %}">AI</a>
    <a href="{{ '/finance' | relative_url }}" class="nav-link{% if page.url == '/finance/' or page.category contains 'Finance' or page.category contains 'Investing' %} active{% endif %}">Finance</a>
    <a href="{{ '/about' | relative_url }}" class="nav-link{% if page.url == '/about/' %} active{% endif %}">About</a>
  </nav>
</header>
